[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
discoclip-engine = { path = "crates/engine" }
discoclip-bot = { path = "crates/bot" }

aes = "0.9"
aes-gcm = "0.11"
argon2 = "0.6"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.12", features = ["cookie"] }
base64 = "0.23"
boa_engine = { version = "0.22", features = ["annex-b"] }
bytes = "1"
cbc = { version = "0.2", features = ["alloc"] }
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
dash-mpd = { version = "0.20", default-features = false, features = ["fetch", "rustls-tls"] }
dirs = "6"
futures = "0.3"
hex = "0.4"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "server-graceful", "service", "tokio", "http1", "http2"] }
ipnet = { version = "2", features = ["serde"] }
jiff = { version = "0.2", features = ["serde"] }
linkify = "0.11"
m3u8-rs = "6"
md-5 = "0.11"
mime = "0.3"
percent-encoding = "2"
rand = "0.10"
regex = "1"
reqwest = { version = "0.13", features = ["form", "json", "stream", "socks", "gzip", "brotli", "deflate", "zstd"] }
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
rustls = "0.23"
rustls-pki-types = { version = "1", features = ["std"] }
rcgen = "0.13"
scraper = "0.27"
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
serde_yaml_ng = "0.10"
sha1_smol = "1"
slug = "0.1"
subtle = "2"
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk"] }
thiserror = "2"
time = "0.3"
toml = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process", "fs", "io-util", "time", "signal"] }
tokio-rusqlite = "0.8"
tokio-rustls = "0.26"
tokio-stream = { version = "0.1", features = ["sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-websockets = { version = "0.13", features = ["server", "sha1_smol"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
twilight-gateway = { version = "0.17", default-features = false, features = ["rustls-platform-verifier", "twilight-http"] }
twilight-http = "0.17"
twilight-model = "0.17"
twilight-util = { version = "0.17", features = ["builder"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v7", "serde"] }
zstd = "0.14"

liblzma = { version = "0.4", default-features = false, features = ["static"] }
sha2 = "0.11"
tar = "0.4"
ureq = "3"
zip = { version = "5", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# The JavaScript interpreter loads a player script of several megabytes; unoptimized it
# takes six times as long, so it is optimized in debug builds too.
[profile.dev.package.boa_engine]
opt-level = 3
[profile.dev.package.boa_parser]
opt-level = 3
[profile.dev.package.boa_ast]
opt-level = 3
[profile.dev.package.boa_gc]
opt-level = 3
[profile.dev.package.boa_interner]
opt-level = 3
[profile.dev.package.boa_string]
opt-level = 3
