# Hardware encoding. Layer this over compose.yaml:
#
#   docker compose -f compose.yaml -f compose.gpu.yaml up -d
#
# The gpu image carries an ffmpeg built with NVENC, VA-API, Quick Sync and Vulkan, and
# the drivers those open. engine.transcode.encoder is `auto` by default: at startup each
# family is tried in turn and the first that encodes a test clip is used. The Health page
# names the encoder in use, and every job's log says which encoder made its output.

services:
  discoclip:
    image: ghcr.io/nickheyer/discoclip:gpu
    build:
      target: gpu
    # NVIDIA. The host needs the NVIDIA driver and the NVIDIA Container Toolkit, which
    # mounts the driver's libraries into the container: `video` for NVENC and NVDEC,
    # `graphics` for Vulkan, which libplacebo renders Dolby Vision with, `compute` and
    # `utility` for CUDA and nvidia-smi.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility, video, graphics]
    # Intel and AMD instead: delete the deploy block above, hand the render node in, and
    # join the group that owns it on the host (`getent group render | cut -d: -f3`).
    # VA-API encodes on both; Quick Sync encodes on Intel through the VPL runtime.
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "989"
