# Copy to discoclip.toml, or set any key through the environment as
# DISCOCLIP_<SECTION>__<KEY>, for example DISCOCLIP_DISCORD__TOKEN. Environment variables
# override the file. YAML and JSON files work the same way.

data_dir = "data"              # database and secret key

[log]
# A tracing filter: a level, or per-crate directives such as "info,discoclip_engine=debug".
level = "info"

[engine]
cache_dir = "cache"            # ffmpeg and in-flight downloads
workers = 2                    # jobs processed at the same time

[engine.limits]
max_source_bytes = 2147483648  # largest source download accepted
max_duration_secs = 10800      # longest video accepted
max_height = 1080              # taller sources are downscaled

# Uncomment to keep a copy of every finished video.
# [engine.archive]
# dir = "archive"
# keep = "output"              # "output", "source" or "both"

[engine.playlists]
enabled = true                 # a playlist link becomes one job per entry
max_entries = 50               # the most entries one link expands into

[engine.live]
max_capture_secs = 10800       # how long a live stream is recorded before it is cut

[engine.retention]
jobs_days = 90                 # finished jobs older than this are removed; 0 keeps them
failed_jobs_days = 30          # failed and cancelled jobs older than this are removed; 0 keeps them
cache_max_bytes = 21474836480  # the cache is trimmed back under this, oldest first; 0 never trims
sweep_interval_secs = 3600     # how often retention runs

# How resolvers and downloaders reach the platforms.
[http]
user_agent = "DiscoClip/0.1.0" # sent when a request names no other user agent
connect_timeout_secs = 15
request_timeout_secs = 90      # bound on a page or API request; media downloads have none
read_timeout_secs = 60         # longest pause between two chunks of a body
max_redirects = 10

[http.retry]
attempts = 3                   # total attempts, including the first
base_ms = 500                  # the pause before the first retry; each retry doubles it
max_ms = 10000                 # the pause is capped here

[http.rate_limits.default]
per_second = 4.0               # requests per host on average; 0 means no limit
burst = 8                      # how many may go at once when the host has been idle

# Rates by host suffix: youtube.com covers www.youtube.com.
# [http.rate_limits.hosts."youtube.com"]
# per_second = 1.0
# burst = 2

# Proxies by platform and by host suffix, over a default; bypassed hosts go direct.
# [http.proxies]
# default = "socks5h://proxy:1080"
# bypass = ["internal.example"]
# [http.proxies.platforms]
# tiktok = "http://proxy:3128"
# [http.proxies.hosts]
# "googlevideo.com" = "http://proxy:3128"

# Discord applications, with their bot tokens and client secrets, are added in the web app,
# where they are kept encrypted, and so are the rules for which channels each bot watches
# and where its slash commands are registered.

[local]
dir = "data/local"             # where jobs submitted from the web app are written
max_bytes = 104857600          # size budget for web app submissions

[web]
bind = "127.0.0.1:8080"        # address the web app listens on
# public_url = "https://clips.example.com"  # how browsers reach the app; login providers send them back here

# Reverse proxies whose X-Forwarded-For, X-Forwarded-Proto, X-Forwarded-Host and
# Forwarded headers are believed, as addresses or networks. Requests from anywhere else
# keep the address they arrived from.
# trusted_proxies = ["127.0.0.1", "10.0.0.0/8", "::1"]

# Serve HTTPS straight from the binary. Both files are PEM; they are read again when
# they change, so a renewed certificate needs no restart.
# [web.tls]
# cert = "/etc/discoclip/fullchain.pem"
# key = "/etc/discoclip/privkey.pem"

# Logging in with an OAuth provider instead of a password. Register an application at
# the provider with the callback https://<public_url>/api/auth/<provider>/callback,
# where <provider> is github, google, oidc, or discord for the application marked for login.
[auth]
oauth_signup = false           # create a viewer account for a provider identity nobody has linked
# Discord login is offered by the Discord application marked for it in the web app.
# [auth.github]
# client_id = ""
# client_secret = ""
# [auth.google]
# client_id = ""
# client_secret = ""
# [auth.oidc]                  # any OpenID Connect issuer
# name = "Single sign-on"      # what the login button says
# issuer = "https://login.example.com/realms/main"
# client_id = ""
# client_secret = ""
# scopes = ["openid", "profile", "email"]
