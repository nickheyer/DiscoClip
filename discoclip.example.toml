# Copy to discoclip.toml, or set any key through the environment as
# DISCOCLIP_<SECTION>__<KEY>, for example DISCOCLIP_ENGINE__WORKERS. Environment variables
# override the file. YAML and JSON files work the same way.

data_dir = "data"              # database and secret key

[log]
# A tracing filter: a level, or per-crate directives such as "info,discoclip_engine=debug".
level = "info"

[engine]
cache_dir = "cache"            # ffmpeg and active downloads
workers = 2                    # concurrent jobs

[engine.limits]
max_source_bytes = 2147483648  # maximum download size
max_duration_secs = 10800      # maximum duration in seconds
max_height = 1080              # taller sources are downscaled

# Uncomment to keep a copy of every finished video.
# [engine.archive]
# dir = "archive"
# keep = "output"              # "output", "source" or "both"

[engine.playlists]
enabled = true                 # create one job per entry
max_entries = 50               # maximum entries per playlist

[engine.live]
max_capture_secs = 10800       # maximum recording duration in seconds

# HTTP downloads use parallel byte ranges and resume interrupted transfers.
[engine.download]
connections = 4                # parallel connections per file
chunk_bytes = 8388608          # bytes per request. Minimum 65536
resume_attempts = 5            # retry attempts per download

[engine.retention]
jobs_days = 90                 # completed job retention in days. 0 keeps all
failed_jobs_days = 30          # failed job retention in days. 0 keeps all
cache_max_bytes = 21474836480  # maximum cache bytes. 0 disables cleanup
sweep_interval_secs = 3600     # cleanup interval in seconds

# Outgoing HTTP requests.
[http]
user_agent = "DiscoClip/0.1.0" # default request user agent
connect_timeout_secs = 15
request_timeout_secs = 90      # page and API timeout. Excludes media downloads
read_timeout_secs = 60         # maximum wait for response data
max_redirects = 10

[http.retry]
attempts = 3                   # total attempts, including the first
base_ms = 500                  # initial retry delay. Doubles per retry
max_ms = 10000                 # maximum retry delay

[http.rate_limits.default]
per_second = 4.0               # average requests per second. 0 disables the limit
burst = 8                      # maximum requests in a burst

# Rates by host suffix: youtube.com covers www.youtube.com.
# [http.rate_limits.hosts."youtube.com"]
# per_second = 1.0
# burst = 2

# Platform and host proxy overrides. Bypassed hosts connect directly.
# [http.proxies]
# default = "socks5h://proxy:1080"
# bypass = ["internal.example"]
# [http.proxies.platforms]
# tiktok = "http://proxy:3128"
# [http.proxies.hosts]
# "googlevideo.com" = "http://proxy:3128"

# Add Discord applications, credentials, rules and commands through the web app.

[local]
dir = "data/local"             # web submission output directory
max_bytes = 104857600          # size budget for web app submissions

# Scheduled platform checks. Results appear on the Platforms page.
[fixtures]
interval_secs = 86400          # check interval in seconds. 0 disables scheduled checks
timeout_secs = 60              # timeout per test link

[web]
bind = "127.0.0.1:8080"        # address the web app listens on
# public_url = "https://clips.example.com"  # public address for login and media links

# Trusted proxy IP addresses or CIDR networks. Forwarded headers from other hosts
# are ignored.
# trusted_proxies = ["127.0.0.1", "10.0.0.0/8", "::1"]

# HTTPS certificate and key in PEM format. Changed files reload automatically.
# [web.tls]
# cert = "/etc/discoclip/fullchain.pem"
# key = "/etc/discoclip/privkey.pem"

# OAuth login. Register the callback at the provider:
# https://<public_url>/api/auth/<provider>/callback
# Provider IDs: github, google, oidc and discord.
[auth]
oauth_signup = false           # allow new accounts through login providers
# Configure Discord login in Applications.
# [auth.github]
# client_id = ""
# client_secret = ""
# [auth.google]
# client_id = ""
# client_secret = ""
# [auth.oidc]                  # any OpenID Connect issuer
# name = "Single sign-on"      # login button label
# issuer = "https://login.example.com/realms/main"
# client_id = ""
# client_secret = ""
# scopes = ["openid", "profile", "email"]
